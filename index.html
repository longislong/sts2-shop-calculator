<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STS2 ショップ計算機 v8</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#f3f4f6;color:#111827}
.container{max-width:900px;margin:0 auto;padding:16px}
h1{margin:0 0 12px;font-size:1.5rem}
.card{background:white;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.top-grid{display:grid;grid-template-columns:1fr;gap:12px}
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  gap:12px;
}
.reset-button{
  background:#ef4444;
  color:white;
  border:none;
  border-radius:8px;
  padding:10px 14px;
  font-size:.95rem;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
}
.reset-button:hover{
  background:#dc2626;
}

@media (min-width:700px){.top-grid{grid-template-columns:1fr 1fr}}
label{display:block;margin-bottom:6px;font-weight:600}
input[type=number]{width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid #d1d5db;border-radius:8px}
.gold-input{
  font-size:2rem !important;
  font-weight:700;
  background:#eef6ff;
  border:2px solid #93c5fd !important;
  padding:12px !important;
}
.gold-input:focus{
  outline:none;
  border-color:#60a5fa !important;
  box-shadow:0 0 0 3px rgba(96,165,250,.2);
}
.checkrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.checkrow label{margin:0;font-weight:500;display:flex;align-items:center;gap:8px}
.discount-price{width:110px}
.subnote{margin-left:28px;margin-bottom:10px;font-size:.9rem;color:#065f46;font-weight:600}
.hidden{display:none}
.summary-card{position:sticky;top:0;z-index:20;padding:8px 12px}
.summary{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;text-align:center}
.summary-box{background:#f9fafb;border-radius:8px;padding:6px 8px;min-width:0}
.summary-box .value{font-size:1.05rem;font-weight:700;line-height:1.25}
.ok{color:#047857}.ng{color:#b91c1c}
.detail{margin-top:2px;font-size:.72rem;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:center}
th{background:#f3f4f6}td:first-child{text-align:left}
.item-name{
  cursor:pointer;
  display:inline-block;
  min-width:120px;
  padding:2px 4px;
  border-radius:4px;
}
.item-name:hover{
  background:#f3f4f6;
  text-decoration:underline;
}
.name-editor{
  width:100%;
  box-sizing:border-box;
  padding:4px 6px;
  font-size:.95rem;
}
.section{background:#fef3c7;font-weight:700}
.buy{
  appearance:none;
  -webkit-appearance:none;
  width:22px;
  height:22px;
  margin:0;
  border:2px solid #9ca3af;
  border-radius:5px;
  background:#fff;
  cursor:pointer;
  position:relative;
  vertical-align:middle;
}
.buy.can-buy{
  border-color:#22c55e;
  background:#dcfce7;
  box-shadow:0 0 0 3px rgba(34,197,94,.12);
}
.buy:checked{
  background:#6b7280;
  border-color:#4b5563;
}
.buy:checked::after{
  content:"";
  position:absolute;
  left:5px;
  top:1px;
  width:6px;
  height:11px;
  border:solid white;
  border-width:0 3px 3px 0;
  transform:rotate(45deg);
}
.buy.can-buy:checked{
  background:#22c55e;
  border-color:#16a34a;
}
td:last-child{padding:14px 8px}
.export-card{
  margin-top:24px;
}
.export-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}
.export-title{
  font-weight:700;
}
.copy-button{
  border:none;
  border-radius:8px;
  padding:8px 14px;
  background:#374151;
  color:white;
  font-weight:700;
  cursor:pointer;
}
.copy-button:hover{
  background:#1f2937;
}
.export-text{
  width:100%;
  min-height:260px;
  box-sizing:border-box;
  resize:vertical;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:8px;
  background:#fafafa;
  font-family:"Consolas","Cascadia Mono","MS Gothic",monospace;
  font-size:.95rem;
  line-height:1.45;
  white-space:pre;
}
</style>
</head>
<body>
<div class="container">
<div class="top-bar">
<h1>STS2 ショップ計算機 v22</h1>
<button type="button" id="resetAll" class="reset-button">入力を全リセット</button>
</div>

<div class="card top-grid">
  <div>
    <label>所持金</label>
    <input type="number" id="gold" class="gold-input" placeholder="0" min="0">
  </div>
  <div>
    <div class="checkrow">
      <label><input type="checkbox" id="buyMember"> 会員カードを購入する場合の販売価格</label>
      <input type="number" id="buyMemberPrice" class="discount-price" placeholder="0" min="0">
    </div>
    <div class="checkrow">
      <label><input type="checkbox" id="buyCourier"> 配達人を購入する場合の販売価格</label>
      <input type="number" id="buyCourierPrice" class="discount-price" placeholder="0" min="0">
    </div>
    <div class="subnote hidden" id="courierDiscountView">会員カード割引適用後：0 G</div>
  </div>
</div>

<div class="card summary-card">
  <div class="summary">
    <div class="summary-box"><div>初期所持金</div><div class="value" id="goldView">0</div></div>
    <div class="summary-box"><div>商品合計</div><div class="value" id="itemTotalDisplay">0 G</div><div class="detail" id="itemTotalDetail">0</div></div>
    <div class="summary-box"><div>残金</div><div class="value ok" id="remain">0</div></div>
  </div>
</div>

<div class="card">
<table>
<thead><tr><th>種類</th><th>価格</th><th>割引後</th><th>購入</th></tr></thead>
<tbody id="shopBody"></tbody>
</table>
</div>

<div class="card export-card">
  <div class="export-header">
    <div class="export-title">現在の状態</div>
    <button type="button" id="copyState" class="copy-button">コピー</button>
  </div>
  <textarea id="stateText" class="export-text" readonly spellcheck="false"></textarea>
</div>
</div>

<script>
const categories=[
  {name:"通常カード",key:"cards",dynamic:true,maxRows:5},
  {name:"無色カード",key:"colorless",dynamic:true,maxRows:2},
  {name:"レリック",key:"relics",dynamic:true,maxRows:3},
  {name:"ポーション",key:"potions",dynamic:true,maxRows:3},
  {name:"その他",key:"other",dynamic:false}
];

const body=document.getElementById("shopBody");

function createSection(category){
  const tr=document.createElement("tr");
  tr.className="section";
  tr.dataset.section=category.key;
  tr.innerHTML=`<td colspan="4">${category.name}</td>`;
  body.appendChild(tr);
}

function createItemRow(category, beforeNode=null){
  const tr=document.createElement("tr");
  tr.className="item-row";
  tr.dataset.category=category.key;
  tr.innerHTML=`<td><span class="item-name"></span></td><td><input type="number" placeholder="0" min="0" class="price"></td><td class="discounted">0</td><td><input type="checkbox" class="buy"></td>`;

  if(beforeNode){
    body.insertBefore(tr, beforeNode);
  }else{
    // カテゴリの直後に挿入する。次のカテゴリを飛び越えない。
    const nextSection=document.querySelector(`tr.section[data-section="${category.key}"]`)?.nextElementSibling;
    const categoryRows=Array.from(document.querySelectorAll(`tr.item-row[data-category="${category.key}"]`));
    const last=categoryRows[categoryRows.length-1];
    if(last && last.nextSibling){
      body.insertBefore(tr,last.nextSibling);
    }else if(last){
      body.appendChild(tr);
    }else if(nextSection){
      body.insertBefore(tr,nextSection);
    }else{
      body.appendChild(tr);
    }
  }

  renumberCategory(category.key);
  return tr;
}

function renumberCategory(key){
  const rows=Array.from(document.querySelectorAll(`tr.item-row[data-category="${key}"]`));
  const category=categories.find(c=>c.key===key);

  rows.forEach((tr,i)=>{
    const defaultName = key==="other" ? "カード削除" : `${category.name}${i+1}`;
    tr.dataset.defaultName = defaultName;

    if(!tr.dataset.customName){
      tr.querySelector(".item-name").textContent = defaultName;
    }
  });
}

categories.forEach(c=>{
  createSection(c);
  createItemRow(c);
});


function addCategoryRow(category){
  const rows=Array.from(document.querySelectorAll(`tr.item-row[data-category="${category.key}"]`));

  if(category.maxRows && rows.length >= category.maxRows){
    return null;
  }

  const last=rows[rows.length-1];
  if(last && last.nextSibling){
    return createItemRow(category,last.nextSibling);
  }
  const section=document.querySelector(`tr.section[data-section="${category.key}"]`);
  return createItemRow(category, section ? section.nextSibling : null);
}

function syncCategoryRows(category){
  let rows=Array.from(document.querySelectorAll(`tr.item-row[data-category="${category.key}"]`));

  // 動的カテゴリは常に「最後に空欄を1枠」だけ置く。
  // 余分な空欄がある場合だけ、末尾から削除する。
  while(rows.length > 1){
    const last = rows[rows.length - 1];
    const prev = rows[rows.length - 2];

    if(Number(last.querySelector(".price").value || 0) === 0 &&
       Number(prev.querySelector(".price").value || 0) === 0){
      last.remove();
      rows = Array.from(document.querySelectorAll(`tr.item-row[data-category="${category.key}"]`));
    }else{
      break;
    }
  }

  const last = rows[rows.length - 1];
  if(Number(last.querySelector(".price").value || 0) > 0){
    addCategoryRow(category);
  }

  renumberCategory(category.key);
}

function getCourierPurchasePrice(){
  const base=Number(document.getElementById("buyCourierPrice").value||0);
  return document.getElementById("buyMember").checked?Math.floor(base*.5):base;
}
function getDiscountRate(){
  let rate=1;
  if(document.getElementById("buyMember").checked)rate*=.5;
  if(document.getElementById("buyCourier").checked)rate*=.8;
  return rate;
}

// アイテム名クリックで編集
document.addEventListener("click", event => {
  const span = event.target.closest(".item-name");
  if(!span) return;

  const row = span.closest("tr.item-row");
  if(!row) return;

  // 既に編集中なら何もしない
  if(row.querySelector(".name-editor")) return;

  const current = row.dataset.customName || "";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "name-editor";
  input.value = current;
  input.placeholder = row.dataset.defaultName || "";

  span.replaceWith(input);
  input.focus();
  input.select();

  const finish = (commit=true) => {
    let value = commit ? input.value.trim() : current;

    if(value === ""){
      row.dataset.customName = "";
      value = row.dataset.defaultName || "";
    }else{
      row.dataset.customName = value;
    }

    const newSpan = document.createElement("span");
    newSpan.className = "item-name";
    newSpan.textContent = value;
    input.replaceWith(newSpan);
    updateStateText();
  };

  input.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      finish(true);
    }else if(e.key === "Escape"){
      finish(false);
    }
  });

  input.addEventListener("blur", () => finish(true));
});


document.getElementById("resetAll").addEventListener("click", () => {
  if(!confirm("入力内容をすべてリセットしますか？")) return;

  document.getElementById("gold").value = "";

  document.getElementById("buyMember").checked = false;
  document.getElementById("buyCourier").checked = false;
  document.getElementById("buyMemberPrice").value = "";
  document.getElementById("buyCourierPrice").value = "";

  categories.forEach(category => {
    const rows = Array.from(document.querySelectorAll(`tr.item-row[data-category="${category.key}"]`));

    rows.forEach((row, index) => {
      row.querySelector(".price").value = "";
      row.querySelector(".buy").checked = false;

      row.dataset.customName = "";

      const nameEl = row.querySelector(".item-name");
      if(nameEl){
        nameEl.textContent = row.dataset.defaultName || "";
      }

      if(category.dynamic && index > 0){
        row.remove();
      }
    });

    renumberCategory(category.key);
  });

  document.getElementById("courierDiscountView").classList.add("hidden");

  recalc();
  document.getElementById("gold").focus();
});


function getItemDisplayName(row){
  return row.dataset.customName || row.dataset.defaultName || "";
}

function updateStateText(){
  const goldValue=document.getElementById("gold").value.trim();
  const gold=Number(goldValue||0);
  const buyMember=document.getElementById("buyMember").checked;
  const buyCourier=document.getElementById("buyCourier").checked;

  let relicTotal=0;
  if(buyMember) relicTotal+=Number(document.getElementById("buyMemberPrice").value||0);
  if(buyCourier) relicTotal+=getCourierPurchasePrice();

  let selectedItemTotal=0;
  const categoryLines=[];

  categories.forEach(category=>{
    const rows=Array.from(document.querySelectorAll(
      `tr.item-row[data-category="${category.key}"]`
    ));

    const itemLines=[];

    rows.forEach(row=>{
      const price=Number(row.querySelector(".price").value||0);
      if(price<=0) return;

      const rate=getDiscountRate();
      const displayPrice=Math.floor(price*rate);
      const checked=row.querySelector(".buy").checked;

      if(checked) selectedItemTotal+=displayPrice;

      // 価格は3桁幅。購入対象には価格の直前に * を付ける。
      const priceText=String(displayPrice).padStart(3," ");
      const mark=checked ? "*" : " ";
      itemLines.push(`${mark}${priceText} ${getItemDisplayName(row)}`);
    });

    if(itemLines.length){
      categoryLines.push(category.name);
      categoryLines.push(...itemLines);
      categoryLines.push("");
    }
  });

  const grandTotal=selectedItemTotal+relicTotal;
  const remain=gold-grandTotal;

  const lines=[
    `初期所持金：${gold}`,
    `商品合計：${grandTotal}`,
    `残金：${remain}`,
    ""
  ];

  lines.push(...categoryLines);

  document.getElementById("stateText").value=lines.join("\n").trimEnd();
}

document.getElementById("copyState").addEventListener("click", async ()=>{
  const text=document.getElementById("stateText").value;

  try{
    await navigator.clipboard.writeText(text);
    const button=document.getElementById("copyState");
    const original=button.textContent;
    button.textContent="コピーしました";
    setTimeout(()=>button.textContent=original,1200);
  }catch{
    const textarea=document.getElementById("stateText");
    textarea.focus();
    textarea.select();
    document.execCommand("copy");
  }
});

function recalc(){
  const gold=Number(document.getElementById("gold").value||0);
  const buyMember=document.getElementById("buyMember").checked;
  const buyCourier=document.getElementById("buyCourier").checked;
  let relicTotal=0;
  if(buyMember)relicTotal+=Number(document.getElementById("buyMemberPrice").value||0);
  if(buyCourier)relicTotal+=getCourierPurchasePrice();

  const courierView=document.getElementById("courierDiscountView");
  if(buyMember&&buyCourier){
    courierView.textContent=`会員カード割引適用後：${getCourierPurchasePrice()} G`;
    courierView.classList.remove("hidden");
  }else courierView.classList.add("hidden");

  const rate=getDiscountRate();
  let selectedItemTotal=0;
  const remainAfterRelics=gold-relicTotal;

  document.querySelectorAll("#shopBody tr.item-row").forEach(tr=>{
    const input=tr.querySelector(".price");if(!input)return;
    const price=Number(input.value||0);
    const discounted=Math.floor(price*rate);
    tr.querySelector(".discounted").textContent=discounted;

    const buyCheckbox=tr.querySelector(".buy");
    const currentRemain=gold-relicTotal-selectedItemTotal;

    // 行の色は変えず、現在の残金で買える商品のチェックだけ明るくする。
    if(currentRemain>0 && price>0 && discounted<=currentRemain){
      buyCheckbox.classList.add("can-buy");
    }else{
      buyCheckbox.classList.remove("can-buy");
    }

    if(buyCheckbox.checked)selectedItemTotal+=discounted;
  });

  const grandTotal=selectedItemTotal+relicTotal;
  const remain=gold-grandTotal;
  const detail=relicTotal>0?`${selectedItemTotal} + ${relicTotal} (割引レリック価格) = ${grandTotal}`:`${selectedItemTotal}`;

  document.getElementById("goldView").textContent=gold;
  document.getElementById("itemTotalDisplay").textContent=`${grandTotal}`;
  document.getElementById("itemTotalDetail").textContent=detail;

  const remainEl=document.getElementById("remain");
  remainEl.textContent=remain;
  remainEl.classList.toggle("ok",remain>=0);
  remainEl.classList.toggle("ng",remain<0);

  updateStateText();
}

/* 価格欄ではTabで購入チェックを飛ばし、次の商品価格へ移動 */
document.addEventListener("keydown",event=>{
  if(event.key!=="Tab"||!event.target.classList.contains("price"))return;
  const prices=Array.from(document.querySelectorAll("#shopBody .price"));
  const i=prices.indexOf(event.target);
  if(i>=0&&i<prices.length-1){
    event.preventDefault();
    prices[i+1].focus();
    prices[i+1].select();
  }
});

document.addEventListener("input",event=>{
  if(event.target.classList.contains("price")){
    const row = event.target.closest("tr.item-row");
    const category = categories.find(c => c.key === row.dataset.category);
    if(category && category.dynamic){
      syncCategoryRows(category);
    }
  }
  recalc();
});

// 価格欄のTabは購入チェックを飛ばして次の価格欄へ。
document.addEventListener("keydown",event=>{
  if(event.key!=="Tab"||!event.target.classList.contains("price"))return;
  const prices=Array.from(document.querySelectorAll("#shopBody .price"));
  const i=prices.indexOf(event.target);
  if(!event.shiftKey && i>=0 && i<prices.length-1){
    event.preventDefault();
    prices[i+1].focus();
    prices[i+1].select();
  }else if(event.shiftKey && i>0){
    event.preventDefault();
    prices[i-1].focus();
    prices[i-1].select();
  }
});

document.addEventListener("input",recalc);
document.addEventListener("change",recalc);
recalc();
</script>
</body>
</html>
